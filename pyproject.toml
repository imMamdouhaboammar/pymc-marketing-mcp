[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pymc-marketing-mcp"
version = "0.4.0"
description = "A decision-safe MCP interface for Bayesian marketing science with PyMC-Marketing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "PyMC Marketing MCP contributors"}]
dependencies = [
  "pydantic>=2.12,<2.13",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "xarray>=2025.1",
  "arviz>=0.21,<2",
  "h5netcdf>=1.4.0",
  "h5py>=3.10.0",
  "pymc-marketing>=1.0.0,<2",
  "mcp[cli]>=2,<3",
  "uvicorn>=0.34,<1",
  "structlog>=25,<26",
  "pyarrow>=18,<24",
  "pyjwt>=2.8.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "pytest-cov>=6,<8", "pytest-xdist>=3.5", "ruff>=0.12,<1", "pyright>=1.1.390"]

[project.scripts]
marketing-mcp = "marketing_mcp.cli:main"
marketing-mcp-demo = "marketing_mcp.demo:main"
marketing-mcp-auth = "marketing_mcp.auth_cli:main"
marketing-mcp-worker = "marketing_mcp.jobs.worker_cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/marketing_mcp"]

[tool.hatch.build.targets.sdist]
# Ship the Python project only. The dashboard (including its vendored node_modules and
# dashboard/.env.local secrets) and other build detritus must never enter the source distribution.
include = [
  "/src/marketing_mcp",
  "/tests",
  "/scripts",
  "/docs",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/AGENTS.md",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "statistical: requires pymc-marketing and runs sampling",
  "mcp: requires MCP Python SDK",
  "integration: exercises multiple production boundaries",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

