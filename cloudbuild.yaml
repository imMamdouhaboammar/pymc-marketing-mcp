# CI/CD equivalent of scripts/deploy_cloud_run.sh (secure mode). Run the script once
# first: it creates the bucket and the Secret Manager secrets this pipeline references.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'APP_VERSION=$_APP_VERSION'
      - '--build-arg'
      - 'GIT_COMMIT=$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--cpu'
      - '4'
      - '--memory'
      - '8Gi'
      - '--timeout'
      - '1800'
      - '--concurrency'
      - '80'
      # One writer: the SQLite metadata snapshot does not support concurrent instances.
      - '--max-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--execution-environment'
      - 'gen2'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'MARKETING_MCP_SECURITY_PROFILE=http-private-api-key,MARKETING_MCP_MAX_ARTIFACT_SIZE_MB=2048'
      - '--set-secrets'
      - 'MARKETING_MCP_API_KEY=$_SERVICE_NAME-api-key:latest,MARKETING_MCP_TOKEN_SECRET=$_SERVICE_NAME-token-secret:latest'
      - '--add-volume'
      - 'name=mcp-storage,type=cloud-storage,bucket=$_BUCKET_NAME,mount-options=uid=10001;gid=10001'
      - '--add-volume-mount'
      - 'volume=mcp-storage,mount-path=/var/lib/marketing-mcp'
      # Cloud Run IAM stays open so MCP clients can connect; the app enforces API keys.
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'mcp-servers'
  _SERVICE_NAME: 'pymc-marketing-mcp'
  _BUCKET_NAME: '${PROJECT_ID}-pymc-mcp-artifacts'
  _APP_VERSION: '0.4.0'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
