name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent:
    name: Run PR Agent
    if: ${{ github.event.pull_request.draft == false || (github.event.comment && github.event.issue.pull_request) }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent
        if: env.OPENAI_KEY != ''
        uses: The-PR-Agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
