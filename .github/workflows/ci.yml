name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Lint, Types & Docs Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: uv run ruff check src tests scripts

      - name: Type check with pyright
        run: uv run pyright

      - name: Check documentation drift
        run: uv run python scripts/check_docs_drift.py

      - name: Check capability inventory drift
        run: uv run python scripts/generate_capability_inventory.py --check

      - name: Validate production readiness claims
        run: uv run python scripts/render_production_readiness.py --check

  unit-and-contract:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit and contract tests
        run: uv run pytest tests/unit tests/contract tests/evals -q -m "not statistical"

  mcp-integration:
    name: MCP Protocol & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run MCP integration tests
        run: uv run pytest tests/integration -q -m "not statistical"

  release-truth-gates:
    name: Release Truth Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run G0/H0 release truth tests
        run: uv run pytest tests/release/test_g0_production_truth.py -q -m "not statistical"

  package-smoke:
    name: Package & Build Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Install wheel in fresh environment
        run: |
          uv venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/marketing-mcp --help
          /tmp/smoke-venv/bin/marketing-mcp-demo --help
          /tmp/smoke-venv/bin/marketing-mcp-auth --help

  docker-smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pymc-marketing-mcp:ci-test
