name: Dynamic Badges

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-badges:
    name: Generate & Update Dynamic Badges
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies with coverage
        run: |
          uv sync --frozen --extra dev
          uv pip install pytest-cov

      - name: Run tests with coverage
        id: test-run
        run: |
          # Run tests and capture coverage percentage
          uv run pytest tests/unit tests/contract tests/evals -q -m "not statistical" --cov=src/marketing_mcp --cov-report=term-missing > pytest-output.txt 2>&1 || true
          
          # Extract coverage percentage (e.g. 85%)
          COVERAGE=$(grep "TOTAL" pytest-output.txt | awk '{print $NF}' | tr -d '%' || echo "0")
          if [ -z "$COVERAGE" ]; then COVERAGE="0"; fi
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          
          # Check test pass/fail
          if grep -q "failed" pytest-output.txt; then
            echo "test_status=failing" >> $GITHUB_OUTPUT
            echo "test_color=red" >> $GITHUB_OUTPUT
          else
            echo "test_status=passing" >> $GITHUB_OUTPUT
            echo "test_color=brightgreen" >> $GITHUB_OUTPUT
          fi

      - name: Dynamic Badge - Test Status
        if: env.GIST_SECRET != ''
        uses: Schneegans/dynamic-badges-action@v1.9.0
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 49445bb38f7e2e299235c6a04299e75f
          filename: pymc_marketing_mcp_tests.json
          label: Tests
          message: ${{ steps.test-run.outputs.test_status }}
          color: ${{ steps.test-run.outputs.test_color }}
          namedLogo: pytest

      - name: Dynamic Badge - Code Coverage
        if: env.GIST_SECRET != ''
        uses: Schneegans/dynamic-badges-action@v1.9.0
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 49445bb38f7e2e299235c6a04299e75f
          filename: pymc_marketing_mcp_coverage.json
          label: Coverage
          message: ${{ steps.test-run.outputs.coverage }}%
          valColorRange: ${{ steps.test-run.outputs.coverage }}
          minColorRange: 50
          maxColorRange: 90
