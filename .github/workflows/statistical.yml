name: Statistical Nightly & Protected Lane

on:
  schedule:
    # Run nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full_chains:
        description: 'Run full chains / sample count'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  validate-manifest:
    name: Validate Statistical Shard Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify complete statistical collection partition
        run: uv run python scripts/check_statistical_shards.py check

  statistical-suite:
    name: PyMC Statistical Suite (${{ matrix.shard }})
    needs: validate-manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - mmm
          - flighting-budget
          - clv
          - model-selection
          - calibration-lineage
          - serialization-invariants
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run statistical shard
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          selectors_file=$(mktemp)
          trap 'rm -f "${selectors_file}"' EXIT
          uv run python scripts/check_statistical_shards.py selectors \
            --shard "${{ matrix.shard }}" > "${selectors_file}"
          mapfile -t selectors < "${selectors_file}"
          test "${#selectors[@]}" -gt 0
          set +e
          uv run pytest -v --durations=20 \
            --junitxml="pytest-${{ matrix.shard }}.xml" \
            "${selectors[@]}"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit "${exit_code}"

      - name: Record statistical shard evidence
        if: always()
        run: |
          uv run python scripts/check_statistical_shards.py record \
            --shard "${{ matrix.shard }}" \
            --junit "pytest-${{ matrix.shard }}.xml" \
            --output "evidence/statistical-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}.json" \
            --sha "${{ github.sha }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --exit-code "${{ steps.pytest.outputs.exit_code || '1' }}"

      - name: Upload statistical shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statistical-evidence-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: evidence/statistical-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Enforce statistical shard result
        if: always()
        run: test "${{ steps.pytest.outcome }}" = "success"

  statistical-aggregate:
    name: Statistical Evidence Aggregate
    needs: statistical-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and setup Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Download all shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statistical-evidence-${{ github.sha }}-${{ github.run_attempt }}-*
          path: shard-evidence
          merge-multiple: true

      - name: Validate and aggregate shard evidence
        run: |
          uv run python scripts/check_statistical_shards.py aggregate \
            --evidence-dir shard-evidence \
            --sha "${{ github.sha }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --output "statistical-aggregate-${{ github.sha }}-${{ github.run_attempt }}.json"

      - name: Upload statistical aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statistical-aggregate-${{ github.sha }}-${{ github.run_attempt }}
          path: statistical-aggregate-${{ github.sha }}-${{ github.run_attempt }}.json
          if-no-files-found: error
