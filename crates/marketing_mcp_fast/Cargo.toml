[package]
name = "marketing_mcp_fast"
version = "0.1.0"
edition = "2021"

[lib]
name = "marketing_mcp_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
csv = "1.3"
memchr = "2.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
